[project]
name = "photo-ai-orchestrator"
version = "0.1.0"
description = "photo-ai pipeline orchestrator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.9,<1",
    "rembg>=2.0.59,<3",
    "onnxruntime>=1.18.0,<2",
    "Pillow>=10.4.0,<12",
    "numpy>=1.24.0,<2",
    # basicsr 1.4.x breaks on torchvision>=0.17 (functional_tensor removed)
    "torch==2.1.2",
    "torchvision==0.16.2",
    "basicsr==1.4.2",
    "realesrgan==0.3.0",
    "opencv-python-headless>=4.8.0,<5",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
