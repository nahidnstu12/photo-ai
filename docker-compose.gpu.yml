# NVIDIA GPU override — Linux hosts only
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  comfyui:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      COMFYUI_EXTRA_ARGS: "--force-fp16"
