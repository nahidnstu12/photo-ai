# photo-ai — Docker Compose (Phase 1 foundation)
# Services added incrementally per docs/phases/

services:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      WORKFLOW_POLISH_PATH: ${WORKFLOW_POLISH_PATH:-/workflows/polish_catalog.json}
    volumes:
      - ./data:/data
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

